version: 2.1
parameters:
  auto_main_checks:
    type: boolean
    default: true
  run_manual_checks:
    type: boolean
    default: false
jobs:
  python-syntax:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Compile Python source without launching GUI
          command: |
            python -m py_compile gh-setup.py gh-setup-v3.py gh-setup-v4.py
workflows:
  syntax-ci:
    # CI_MASTER_TOGGLE: managed by scripts/ci-master-toggle.py
    when: << pipeline.parameters.auto_main_checks >>
    jobs:
      - python-syntax:
          filters:
            branches:
              only: main
